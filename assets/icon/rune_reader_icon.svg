<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>RuneReader</title>
  <!--
    Open book with the Elder Futhark rune Raidō (ᚱ, "R") rising from the
    spine. The four small runes on the pages spell R-U-N-E (ᚱᚢᚾᛖ).
    Main motif stays inside the central 66/108 adaptive-icon safe zone.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3366"/>
      <stop offset="1" stop-color="#14172F"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="230" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD27A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7A8"/>
      <stop offset="1" stop-color="#E2A63A"/>
    </linearGradient>
    <linearGradient id="pageL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#D9CDAE"/>
      <stop offset="0.25" stop-color="#F4ECD8"/>
      <stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D9CDAE"/>
      <stop offset="0.25" stop-color="#F4ECD8"/>
      <stop offset="1" stop-color="#FBF6EA"/>
    </linearGradient>
  </defs>

  <!-- Background (launchers apply their own mask) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="170" fill="url(#glow)"/>

  <!-- Page block thickness -->
  <path d="M112 352 C160 338 214 342 256 366 C298 342 352 338 400 352 L400 372 C352 358 298 362 256 386 C214 362 160 358 112 372 Z"
        fill="#B9A77C"/>

  <!-- Pages -->
  <path d="M256 366 C214 342 160 338 112 352 L112 230 C160 216 214 220 256 244 Z" fill="url(#pageL)"/>
  <path d="M256 366 C298 342 352 338 400 352 L400 230 C352 216 298 220 256 244 Z" fill="url(#pageR)"/>

  <!-- R-U-N-E in small runes on the pages -->
  <g fill="none" stroke="#7A6A4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <!-- ᚱ -->
    <path d="M136 262 V306 M136 262 L152 274 L136 285 L154 306"/>
    <!-- ᚢ -->
    <path d="M176 306 V258 L196 270 V306"/>
    <!-- ᚾ -->
    <path d="M326 258 V306 M318 290 L334 274"/>
    <!-- ᛖ -->
    <path d="M354 306 V258 L366 274 L378 258 V306"/>
  </g>

  <!-- Rune Raidō rising from the spine: dark outline, then gold stroke -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="bevel">
    <path d="M222 356 V114 L294 168 L222 222 L300 354"
          stroke="#14172F" stroke-width="40"/>
    <path d="M222 356 V114 L294 168 L222 222 L300 354"
          stroke="url(#gold)" stroke-width="24"/>
  </g>
</svg>
